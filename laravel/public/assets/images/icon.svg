<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- RC ERP POS icon — shopping cart on indigo gradient.
       Designed to be readable at 16px (favicon) through 512px (PWA install icon).
       Maskable-safe: the cart sits inside the inner 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (covers the entire 512x512 for maskable purpose) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- White shopping cart glyph, centered, ~70% of canvas (maskable safe zone) -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(96,96) scale(0.625)">
    <!-- Cart body: handle bar + basket + wheels -->
    <path d="M 80 80 L 130 80 L 175 280 L 380 280 L 420 140 L 170 140"/>
    <!-- Front wheel -->
    <circle cx="210" cy="335" r="22" fill="#ffffff" stroke="none"/>
    <!-- Back wheel -->
    <circle cx="350" cy="335" r="22" fill="#ffffff" stroke="none"/>
  </g>
  <!-- Small "RC" badge in the bottom-right (maskable safe — inside 80%) -->
  <g transform="translate(372,372)">
    <rect width="100" height="100" rx="20" fill="#ffffff"/>
    <text x="50" y="68" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"
          text-anchor="middle" fill="#4f46e5">RC</text>
  </g>
</svg>
