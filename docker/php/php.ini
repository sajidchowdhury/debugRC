# =============================================================================
# RC_ERP_v2 — Custom PHP Configuration
# =============================================================================
# Loaded as /usr/local/etc/php/conf.d/rcerp-custom.ini
# =============================================================================

; Memory + execution
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 50M
post_max_size = 50M

; Error reporting (development)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
log_errors = On

; Timezone
date.timezone = Asia/Dhaka

; OPcache (production settings)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Redis session handler (matches legacy PHP session.save_path)
; Legacy uses: session.save_handler = redis
;              session.save_path = "tcp://127.0.0.1:6379?database=1"
session.save_handler = redis
session.save_path = "tcp://rcerp_redis:6379?database=1"
session.cookie_name = PHPSESSID
session.gc_maxlifetime = 28800
session.cookie_lifetime = 28800

; Realpath cache (improves Docker performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
