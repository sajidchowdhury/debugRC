# =============================================================================
# RC_ERP_v2 — Nginx Configuration for Docker
# =============================================================================
# Serves the Laravel application at port 80 (mapped to 8080 on host).
#
# IMPORTANT: Uses resolver directive + variable for PHP-FPM upstream.
# This prevents nginx from crashing at startup if the rcerp_app container
# isn't ready yet. The DNS resolution happens per-request instead.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Laravel public directory
    root /var/www/laravel/public;
    index index.php index.html;

    # Client upload limits
    client_max_body_size 50M;

    # ---------------------------------------------------------------------------
    # Docker DNS resolver — allows nginx to resolve container names dynamically.
    # 127.0.0.11 is Docker's built-in DNS server on the bridge network.
    # valid=10s means cached DNS entries expire after 10 seconds, so nginx
    # picks up restarted containers quickly.
    # ---------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------------
    # PHP-FPM upstream as a variable.
    # Using $app_upstream prevents nginx from resolving "rcerp_app" at startup,
    # which would fail if the app container isn't running yet.
    # ---------------------------------------------------------------------------
    set $app_upstream rcerp_app;

    # ---------------------------------------------------------------------------
    # Laravel routes — everything goes through index.php
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # SSE (Server-Sent Events) — Phase 1E (Task 31)
    # ---------------------------------------------------------------------------
    # SSE requires special Nginx configuration:
    #   - Disable proxy_buffering (events must stream immediately)
    #   - Disable fastcgi_buffering (same reason)
    #   - Set proxy_read_timeout to 5 minutes (SSE connections are long-lived)
    #   - Disable gzip (SSE spec requires uncompressed streaming)
    #   - Set Content-Type to text/event-stream
    # ---------------------------------------------------------------------------
    location /sse/ {
        try_files $uri /index.php?$query_string;

        fastcgi_pass $app_upstream:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param HTTPS $https if_not_empty;
        include fastcgi_params;

        # SSE-specific: disable all buffering
        fastcgi_buffering off;
        fastcgi_cache off;

        # Long timeout for SSE connections (5 minutes)
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 300s;

        # SSE headers
        add_header Content-Type text/event-stream always;
        add_header Cache-Control no-cache always;
        add_header Connection keep-alive always;
        add_header X-Accel-Buffering no always;

        # Disable gzip for SSE
        gzip off;
    }

    # ---------------------------------------------------------------------------
    # Vite build assets (CSS, JS) — serve directly
    # ---------------------------------------------------------------------------
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Static assets (CSS, JS, images) — serve directly
    # ---------------------------------------------------------------------------
    # /assets/ directory: short cache (10 min) for dev — allows quick
    # iteration without hard-refresh. Query-string ?v= is cache-bust.
    # /build/ directory (Vite): immutable 1-year cache (content-hashed).
    # Other static files: 1-year cache (fonts, images rarely change).
    location ~* ^/assets/.*\.(css|js)$ {
        try_files $uri =404;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
        access_log off;
    }
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # PHP file handling — pass to PHP-FPM
    # ---------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass $app_upstream:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param HTTPS $https if_not_empty;
        include fastcgi_params;

        # Timeouts
        fastcgi_read_timeout 120;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout 120;

        # Buffer settings
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------------------------------------------------------------------------
    # Security — deny access to sensitive files
    # ---------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(storage|vendor|node_modules|database)/ {
        deny all;
    }

    location ~* \.(env|git|gitignore|gitattributes|md|lock|sql)$ {
        deny all;
    }

    # ---------------------------------------------------------------------------
    # Error pages
    # ---------------------------------------------------------------------------
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ---------------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;
}
