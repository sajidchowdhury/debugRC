; ===========================================================================
; RC_ERP_v2 — supervisor program config for the Laravel queue worker
; ===========================================================================
; Purpose:
;   Supervise the Laravel queue worker (`php artisan queue:work`) on non-Docker
;   deployments. This is the COMPANION to `rcerp-listen-notify.conf` — the two
;   workers are provisioned together in
;   `AI_CONTEXT/deployment/vps-bdix-deployment.md` §8.10.
;
;   The queue worker handles async jobs dispatched via `dispatch(new Job(...))`
;   (e.g. report generation, partition export, batch notification fanout).
;   Like the LISTEN/NOTIFY worker it is a long-running process and MUST NOT be
;   scheduled via Laravel cron (`Schedule::command('queue:work')` would fork a
;   new instance every minute).
;
; Install:
;   sudo cp supervisor/rcerp-queue-worker.conf \
;          /etc/supervisor/conf.d/rcerp-queue-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start rcerp-queue-worker:*
;
; Tuning notes:
;   - numprocs=2: two workers is a conservative starting point. Monitor with
;     `sudo supervisorctl status` + `php artisan queue:monitor` and tune based
;     on observed job backlog. Each worker holds a PG + Redis connection.
;   - stopwaitsecs=3600: a generous ceiling so a worker mid-job is not SIGKILLed
;     during a deploy. The worker drains its current job before exiting.
;   - --max-time=3600: worker self-restarts every hour to release memory
;     (mitigates PHP's long-running-process memory growth).
;
; Cross-references:
;   - `AI_CONTEXT/deployment/cron-scheduled-jobs.md`: the OTHER half of async
;     work — periodic Laravel-scheduler commands (these ARE cron-managed).
;   - `AI_CONTEXT/deployment/vps-bdix-deployment.md` §8.10: provisioning.
; ===========================================================================

[program:rcerp-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/rcerp_v2/laravel/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/rcerp_v2/laravel
autostart=true
autorestart=true
startsecs=5
startretries=3
user=rcerp
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/rcerp_v2/laravel/storage/logs/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=3600
stopsignal=TERM
environment=APP_ENV="production"
