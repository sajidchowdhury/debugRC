; ===========================================================================
; RC_ERP_v2 — supervisor program config for the LISTEN/NOTIFY worker
; ===========================================================================
; Purpose:
;   Supervise the long-running `php artisan listen-notify:worker` process on
;   non-Docker deployments (bare-metal VPS / BDIX). On Docker deployments this
;   is handled by `docker-compose.yml`'s `rcerp_listen_notify` service with
;   `restart: unless-stopped` — see `AI_CONTEXT/deployment/docker-setup.md`.
;
;   This worker is NOT schedulable by Laravel cron (`routes/console.php`)
;   because it is a never-ending event loop: `Schedule::command(...)` would
;   fork a new instance every minute and block the scheduler. Supervision by a
;   process manager (supervisor OR systemd) is the correct pattern.
;
; Install:
;   sudo cp supervisor/rcerp-listen-notify.conf \
;          /etc/supervisor/conf.d/rcerp-listen-notify.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start rcerp-listen-notify
;
;   (The full provisioning sequence is in
;   `AI_CONTEXT/deployment/vps-bdix-deployment.md` §8.10.)
;
; Verify:
;   sudo supervisorctl status
;   # Expected: rcerp-listen-notify   RUNNING   pid 12345, uptime 0:01:23
;
; Tuning notes:
;   - numprocs=1: there MUST be exactly one worker. PostgreSQL `LISTEN` is
;     connection-scoped — multiple workers would each receive every NOTIFY
;     (duplicate fanout) and stomp on each other's Redis writes. Do NOT raise.
;   - stopwaitsecs=10: the worker's main loop has a 100ms `usleep`, so a clean
;     SIGTERM is honoured within ~1 second. 10s is a safe ceiling; raising it
;     delays supervisor restart after a hang.
;   - autorestart=true: any uncaught exit (PG disconnect, OOM, PHP fatal) is
;     treated as a transient failure and the process is restarted. The worker
;     also self-reports liveness via the Redis heartbeat key
;     `rcerp:listen_notify:heartbeat` (TTL 120s), surfaced at `/sse/status`.
;
; Cross-references:
;   - Gap G-092 (architecture/realtime-events.md G4): the absence of in-repo
;     supervisor config templates. This file is the canonical fix.
;   - `systemd/rcerp-listen-notify.service`: the systemd-native alternative.
;     Pick ONE supervisor; do not run both.
;   - `AI_CONTEXT/architecture/realtime-events.md` §7.2: worker internals.
; ===========================================================================

[program:rcerp-listen-notify]
process_name=%(program_name)s
command=php /var/www/rcerp_v2/laravel/artisan listen-notify:worker
directory=/var/www/rcerp_v2/laravel
autostart=true
autorestart=true
startsecs=5
startretries=3
user=rcerp
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/rcerp_v2/laravel/storage/logs/listen-notify.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=10
stopsignal=TERM
environment=APP_ENV="production"
